name: Scheduled source fetch

# Runs the public-source fetchers on the cadence set in
# docs/data-sourcing-plan.md §4 and commits their outputs under sourcing/:
#   - weekly  (Mon 06:00 UTC):  scripts/fetch-trials.js     (trial watch)
#   - monthly (3rd 06:30 UTC):  scripts/fetch-globalfund.js (grants + disbursements)
#                               scripts/fetch-regulatory.js (WHO PQ + EMA EU-M4all)
# When the trial or regulatory watch detects changes, it opens an issue
# carrying the what-changed report so an analyst reviews it — the fetchers
# never touch data/products.js (the analyst + validator remain the only gate).
#
# The bot commit touches only sourcing/, which publish.yml's path filter
# ignores, so it cannot trigger a history snapshot or feed rebuild.
#
# Manual run: Actions tab → "Scheduled source fetch" → Run workflow
# (choose which fetchers; default = all). Locally: see sourcing/README.md.

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly — trials
    - cron: "30 6 3 * *"  # monthly — Global Fund
  workflow_dispatch:
    inputs:
      fetchers:
        description: "Which fetchers to run"
        type: choice
        options: [all, trials, globalfund, regulatory]
        default: all

permissions:
  contents: write
  issues: write

# Shares the bot-push group with publish.yml so two bot pushes to main
# never race each other (the loser would fail non-fast-forward).
concurrency:
  group: bot-push-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide which fetchers this trigger runs
        id: plan
        run: |
          RUN_TRIALS=false; RUN_GF=false; RUN_REG=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.fetchers }}" in
              all)        RUN_TRIALS=true; RUN_GF=true; RUN_REG=true ;;
              trials)     RUN_TRIALS=true ;;
              globalfund) RUN_GF=true ;;
              regulatory) RUN_REG=true ;;
            esac
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            RUN_TRIALS=true
          else
            RUN_GF=true; RUN_REG=true
          fi
          echo "trials=$RUN_TRIALS" >> "$GITHUB_OUTPUT"
          echo "globalfund=$RUN_GF" >> "$GITHUB_OUTPUT"
          echo "regulatory=$RUN_REG" >> "$GITHUB_OUTPUT"

      - name: Fetch trials (ClinicalTrials.gov)
        if: steps.plan.outputs.trials == 'true'
        run: node scripts/fetch-trials.js

      - name: Fetch Global Fund grants and disbursements
        if: steps.plan.outputs.globalfund == 'true'
        run: node scripts/fetch-globalfund.js

      - name: Fetch regulatory lists (WHO PQ + EMA EU-M4all)
        if: steps.plan.outputs.regulatory == 'true'
        run: node scripts/fetch-regulatory.js

      - name: Commit sourcing outputs
        # always(): if one fetcher fails, the outputs of the ones that
        # succeeded are still committed (the job stays red for triage).
        if: always()
        run: |
          git config user.name "launch-dashboard-bot"
          git config user.email "actions@github.com"
          # Record which watch reports THIS run produced/changed, for the issue
          # step — done before committing, while they still show as dirty.
          git status --porcelain sourcing/reports 2>/dev/null | grep -oE 'sourcing/reports/(trials|regulatory)-watch-[0-9-]+\.md' > /tmp/new-reports.txt || true
          git add sourcing
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: scheduled source fetch [bot]"
            git push
          fi

      - name: Open an issue if a watch report found changes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the reports this run produced (recorded by the commit step,
          # named by the fetcher's own start date — survives midnight rollover).
          NEW_REPORTS=$(cat /tmp/new-reports.txt 2>/dev/null || true)
          if [ -z "$NEW_REPORTS" ]; then echo "No new watch reports — no issue."; fi
          for REPORT in $NEW_REPORTS; do
            KIND=$(basename "$REPORT" | sed -E 's/-watch-.*//')
            DATE=$(basename "$REPORT" | sed -E 's/^[a-z]+-watch-(.*)\.md$/\1/')
            if grep -q "Changes since" "$REPORT"; then
              case "$KIND" in
                trials)     TITLE="Trial watch" ;;
                regulatory) TITLE="Regulatory watch" ;;
              esac
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE: changes detected — $DATE" \
                --body-file "$REPORT"
            else
              echo "No $KIND changes — no issue."
            fi
          done
