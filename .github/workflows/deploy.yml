name: Deploy site to GitHub Pages

# Builds the Next.js static export (out/) and publishes it with GitHub Pages
# "GitHub Actions" source. One-time repo setting: Settings → Pages → Build and
# deployment → Source: GitHub Actions.
#
# Triggers: every push to main, plus after the bot's "Snapshot history and
# rebuild feed" run — its commit is pushed with GITHUB_TOKEN, which does not
# trigger push workflows, so without this the live feed/ontology would lag.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Snapshot history and rebuild feed"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # skip when the bot run that triggered us failed
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # workflow_run: build the latest main, including the bot commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate data
        run: npm run validate
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
