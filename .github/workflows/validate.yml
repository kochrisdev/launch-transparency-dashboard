name: Validate dashboard data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data file (v1)
        run: node scripts/validate-data.js
      - name: Validate v2 preview dataset
        run: node scripts/validate-data.js data/products.v2.js
      - name: Validate synthetic dataset
        run: node scripts/validate-data.js data/products.synthetic.js
      - name: Build single-file preview (smoke test)
        run: node scripts/make-preview.js
